<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="theme-color" content="#0a0a0a">
  <title>Jarvis</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div>
      <h1>Сайн уу, Билэг</h1>
      <div class="sub" id="date-txt"></div>
      <div class="score-chip" id="score-chip"></div>
    </div>
    <div class="avatar" id="avatar-btn" onclick="toggleAccountMenu()">Б</div>
  </header>

  <!-- ACCOUNT MENU -->
  <div id="account-menu" class="account-menu" style="display:none">
    <div id="account-info" class="account-info">Уншиж байна...</div>
    <button onclick="if(confirm('Гарах уу?')){window.signOut?.();document.getElementById('account-menu').style.display='none'}">🚪 Гарах</button>
  </div>

  <!-- JARVIS PANEL -->
  <div class="jarvis-panel">
    <div class="jarvis-head">
      <div class="j-dot"></div>
      <span class="j-label">JARVIS</span>
      <button class="j-refresh" onclick="refreshJarvis()" title="Шинэчлэх">↻</button>
    </div>
    <div class="j-msg" id="j-msg"></div>
  </div>

  <!-- ROUTINE -->
  <div class="sec-label">Өдрийн routine</div>
  <div class="routine-scroll">

    <!-- Water -->
    <div class="r-item" id="ri-water">
      <div class="r-circle">
        <span class="r-icon">💧</span>
        <span class="r-num" id="w-num">0</span>
        <div class="r-check">✓</div>
      </div>
      <div class="w-controls">
        <button class="w-btn" onclick="changeWater(-1)">−</button>
        <span class="w-val">/8</span>
        <button class="w-btn" onclick="changeWater(1)">+</button>
      </div>
      <span class="r-label">Ус</span>
    </div>

    <!-- Exercise -->
    <div class="r-item" id="ri-exercise" onclick="toggleR('exercise')">
      <div class="r-circle">
        <span class="r-icon">🏃</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Дасгал</span>
    </div>

    <!-- Hanzi -->
    <div class="r-item" id="ri-hanzi" onclick="toggleR('hanzi')">
      <div class="r-circle">
        <span class="r-icon" style="font-size:22px;font-family:serif">汉</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">汉字</span>
    </div>

    <!-- Read -->
    <div class="r-item" id="ri-read" onclick="toggleR('read')">
      <div class="r-circle">
        <span class="r-icon">📖</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Унших</span>
    </div>

    <!-- Journal -->
    <div class="r-item" id="ri-journal" onclick="toggleR('journal')">
      <div class="r-circle">
        <span class="r-icon">🌙</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Journal</span>
    </div>

  </div>

  <!-- MISSIONS -->
  <div class="sec-label" style="margin-top:4px">Миссион</div>
  <div class="mission-section" id="mission-section"></div>

  <!-- FEED -->
  <div class="sec-label" style="margin-top:8px">Өнөөдөр</div>
  <div class="feed" id="feed"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">   <span class="ni">🏠</span><span>Нүүр</span></a>
    <a class="nav-item"        href="tracker.html">  <span class="ni">📊</span><span>Tracker</span></a>
    <a class="nav-item"        href="dashboard.html"><span class="ni">📈</span><span>Статс</span></a>
    <a class="nav-item"        href="index.html">   <span class="ni" style="font-family:serif">汉</span><span>汉字</span></a>
    <a class="nav-item"        href="profile.html"><span class="ni">👤</span><span>Профайл</span></a>
  </nav>

  <div id="sync-bar" class="sync-bar" style="display:none"></div>
  <div id="toast"></div>

  <!-- JARVIS CHAT -->
  <button class="chat-fab" id="chat-fab" onclick="toggleChat()" title="JARVIS-тай чатлах">🤖</button>

  <div class="chat-overlay" id="chat-overlay">
    <div class="chat-box">
      <div class="chat-header">
        <div class="chat-title">
          <div class="j-dot"></div>
          <span>JARVIS Chat</span>
        </div>
        <button class="chat-clear" onclick="onClearChat()" title="Түүх устгах">🗑</button>
        <button class="chat-close" onclick="toggleChat()">✕</button>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input" type="text"
               placeholder="Асуулт бич..." autocomplete="off"
               onkeydown="if(event.key==='Enter')sendChat()">
        <button class="chat-send" onclick="sendChat()">➤</button>
      </div>
      <div class="chat-key-row" id="chat-key-row" style="display:none">
        <input class="chat-key-input" id="chat-key-input" type="password"
               placeholder="GitHub Token оруул (ghp_...)">
        <button class="chat-key-save" onclick="saveGeminiKey()">Хадгал</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="gemini.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    // ── ACCOUNT MENU ─────────────────────────────────────────────
    function toggleAccountMenu() {
      const menu = document.getElementById('account-menu');
      const open = menu.style.display === 'none';
      menu.style.display = open ? 'block' : 'none';
      if (open) {
        const user = firebase.auth().currentUser;
        const info = document.getElementById('account-info');
        if (user?.email) info.textContent = '✉️ ' + user.email;
        else if (user?.isAnonymous) info.textContent = '👤 Anonymous (нэвтрээгүй)';
        else info.textContent = '—';
      }
    }
    document.addEventListener('click', e => {
      const menu = document.getElementById('account-menu');
      if (menu && !menu.contains(e.target) && e.target.id !== 'avatar-btn') {
        menu.style.display = 'none';
      }
    });

    // ── CHAT UI ───────────────────────────────────────────────────
    function toggleChat() {
      const overlay = document.getElementById('chat-overlay');
      const open = overlay.classList.toggle('open');
      if (open) {
        checkKeyRow();
        loadChatHistory();
        document.getElementById('chat-input').focus();
      }
    }

    // localStorage-аас түүх уншиж харуулна
    function loadChatHistory() {
      const el = document.getElementById('chat-messages');
      el.innerHTML = '';
      const history = _loadHistory();
      if (history.length === 0) {
        appendMsg('model', 'Сайн уу! Юу асуух вэ? 💬');
        return;
      }
      history.forEach(m => {
        const text = m.content || m.parts?.[0]?.text || '';
        appendMsg(m.role === 'user' ? 'user' : 'model', text);
      });
    }

    function onClearChat() {
      if (!confirm('Чат түүхийг устгах уу?')) return;
      clearChatHistory();
      const el = document.getElementById('chat-messages');
      el.innerHTML = '';
      appendMsg('model', 'Түүх цэвэрлэгдлээ. Юу асуух вэ? 💬');
    }

    function checkKeyRow() {
      const hasKey = !!localStorage.getItem('jarvis_chat_key');
      document.getElementById('chat-key-row').style.display = hasKey ? 'none' : 'flex';
    }

    function saveGeminiKey() {
      const key = document.getElementById('chat-key-input').value.trim();
      if (!key) return;
      localStorage.setItem('jarvis_chat_key', key);
      document.getElementById('chat-key-input').value = '';
      document.getElementById('chat-key-row').style.display = 'none';
      appendMsg('model', '✅ GitHub Token хадгалагдлаа! Одоо асуугаарай.');
    }

    function appendMsg(role, text) {
      const el = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `chat-msg ${role}`;
      div.textContent = text;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      return div;
    }

    async function sendChat() {
      const input = document.getElementById('chat-input');
      const text  = input.value.trim();
      if (!text) return;
      input.value = '';

      appendMsg('user', text);

      const typing = appendMsg('model', '...');
      const reply  = await sendChatMessage(text);
      typing.textContent = reply;
    }
  </script>
</body>
</html>
