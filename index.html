<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="theme-color" content="#0a0a0a">
  <title>Jarvis</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div>
      <h1>Сайн уу, Билэг</h1>
      <div class="sub" id="date-txt"></div>
      <div class="score-chip" id="score-chip"></div>
    </div>
    <div class="avatar">Б</div>
  </header>

  <!-- JARVIS PANEL -->
  <div class="jarvis-panel">
    <div class="jarvis-head">
      <div class="j-dot"></div>
      <span class="j-label">JARVIS</span>
      <button class="j-refresh" onclick="refreshJarvis()" title="Шинэчлэх">↻</button>
    </div>
    <div class="j-msg" id="j-msg"></div>
  </div>

  <!-- ROUTINE -->
  <div class="sec-label">Өдрийн routine</div>
  <div class="routine-scroll">

    <!-- Water -->
    <div class="r-item" id="ri-water">
      <div class="r-circle">
        <span class="r-icon">💧</span>
        <span class="r-num" id="w-num">0</span>
        <div class="r-check">✓</div>
      </div>
      <div class="w-controls">
        <button class="w-btn" onclick="changeWater(-1)">−</button>
        <span class="w-val">/8</span>
        <button class="w-btn" onclick="changeWater(1)">+</button>
      </div>
      <span class="r-label">Ус</span>
    </div>

    <!-- Exercise -->
    <div class="r-item" id="ri-exercise" onclick="toggleR('exercise')">
      <div class="r-circle">
        <span class="r-icon">🏃</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Дасгал</span>
    </div>

    <!-- Hanzi -->
    <div class="r-item" id="ri-hanzi" onclick="toggleR('hanzi')">
      <div class="r-circle">
        <span class="r-icon" style="font-size:22px;font-family:serif">汉</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">汉字</span>
    </div>

    <!-- Read -->
    <div class="r-item" id="ri-read" onclick="toggleR('read')">
      <div class="r-circle">
        <span class="r-icon">📖</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Унших</span>
    </div>

    <!-- Journal -->
    <div class="r-item" id="ri-journal" onclick="toggleR('journal')">
      <div class="r-circle">
        <span class="r-icon">🌙</span>
        <div class="r-check">✓</div>
      </div>
      <span class="r-label">Journal</span>
    </div>

  </div>

  <!-- MISSIONS -->
  <div class="sec-label" style="margin-top:4px">Миссион</div>
  <div class="mission-section" id="mission-section"></div>

  <!-- FEED -->
  <div class="sec-label" style="margin-top:8px">Өнөөдөр</div>
  <div class="feed" id="feed"></div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">   <span class="ni">🏠</span><span>Нүүр</span></a>
    <a class="nav-item"        href="tracker.html">  <span class="ni">📊</span><span>Tracker</span></a>
    <a class="nav-item"        href="dashboard.html"><span class="ni">📈</span><span>Статс</span></a>
    <a class="nav-item"        href="index.html">   <span class="ni" style="font-family:serif">汉</span><span>汉字</span></a>
    <a class="nav-item"        href="index.html">   <span class="ni">⚙️</span><span>Тохиргоо</span></a>
  </nav>

  <div id="sync-bar" class="sync-bar" style="display:none"></div>
  <div id="toast"></div>

  <script src="app.js"></script>
  <script src="firebase-config.js"></script>
</body>
</html>
