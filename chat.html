<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JARVIS — AI Chat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="manifest" href="manifest.json">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    /* ── RESET & BASE ────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #07090f;
      --surface:   #0d1117;
      --surface2:  #111827;
      --border:    #1e2d3d;
      --accent:    #00c6ff;
      --gold:      #f0b429;
      --gold-dim:  #a37a1a;
      --text:      #e2e8f0;
      --muted:     #4a5568;
      --user-bg:   linear-gradient(135deg, #b7791f 0%, #f0b429 100%);
      --bot-bg:    #111827;
      --nav-h:     64px;
      --header-h:  60px;
      --safe-bot:  env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── GRID BACKGROUND ─────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,198,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,198,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orb top-right */
    body::after {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,198,255,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ──────────────────────────────────────────────────── */
    .chat-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(7,9,15,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px 4px 0;
      line-height: 1;
    }

    .jarvis-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .j-avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0d1117 0%, #1a2332 100%);
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 12px rgba(0,198,255,0.2);
    }

    .j-info { display: flex; flex-direction: column; }

    .j-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
    }

    .j-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .clear-btn:hover { border-color: #ef4444; color: #ef4444; }

    /* ── MESSAGES AREA ───────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 16px) 16px
               calc(var(--nav-h) + 80px + var(--safe-bot) + 8px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
    }

    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── MESSAGE BUBBLE ──────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg-row.bot .msg-avatar {
      background: linear-gradient(135deg, #0d1117, #1a2332);
      border: 1px solid var(--accent);
      box-shadow: 0 0 10px rgba(0,198,255,0.15);
    }

    .msg-row.user .msg-avatar {
      background: var(--user-bg);
      font-size: 12px;
      font-weight: 700;
      color: #000;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.55;
      position: relative;
      word-break: break-word;
    }

    .msg-row.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--text);
      box-shadow: 0 2px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .msg-row.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
      color: #0a0600;
      font-weight: 500;
      box-shadow: 0 2px 20px rgba(240,180,41,0.2);
    }

    /* Accent top-border on bot bubbles */
    .msg-row.bot .bubble::before {
      content: '';
      position: absolute;
      top: -1px; left: 16px; right: 60%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.4;
      animation: blink 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    /* ── DATE DIVIDER ────────────────────────────────────────────── */
    .date-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0;
    }
    .date-divider::before, .date-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .date-divider span {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    /* ── INPUT BAR ───────────────────────────────────────────────── */
    .input-bar {
      position: fixed;
      left: 0; right: 0;
      bottom: calc(var(--nav-h) + var(--safe-bot));
      padding: 10px 14px 10px;
      background: rgba(7,9,15,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: rgba(0,198,255,0.4);
      box-shadow: 0 0 0 3px rgba(0,198,255,0.06), 0 0 20px rgba(0,198,255,0.08);
    }

    #chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      min-height: 22px;
      max-height: 100px;
      line-height: 1.5;
      padding: 1px 0;
    }

    #chat-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0d8faa 0%, #00c6ff 100%);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 12px rgba(0,198,255,0.3);
    }

    .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(0,198,255,0.4); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.4; transform: none; cursor: default; }

    .send-btn svg { width: 18px; height: 18px; fill: #000; }

    /* ── TOKEN ROW ───────────────────────────────────────────────── */
    .token-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(240,180,41,0.06);
      border: 1px solid rgba(240,180,41,0.2);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .token-row input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--gold);
      font-size: 13px;
      font-family: inherit;
    }
    .token-row input::placeholder { color: var(--gold-dim); }
    .token-save-btn {
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ── BOTTOM NAV ──────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bot));
      padding-bottom: var(--safe-bot);
      background: rgba(7,9,15,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 200;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.5px;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-item .ni { font-size: 20px; line-height: 1; }
    .nav-item span:last-child { font-size: 10px; }

    .nav-item.active { color: var(--accent); }
    .nav-item.active .ni { filter: drop-shadow(0 0 6px var(--accent)); }

    /* ── EMPTY STATE ─────────────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 32px;
      gap: 16px;
      opacity: 0.6;
      animation: fadeUp 0.4s ease;
    }

    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #0d1117, #1a2332);
      border: 1px solid rgba(0,198,255,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 24px rgba(0,198,255,0.15);
    }

    .empty-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
    }

    .empty-sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip:active { transform: scale(0.96); }

    /* ── INTEL BUTTON ────────────────────────────────────────────── */
    .intel-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, rgba(0,198,255,0.1), rgba(124,92,252,0.1));
      border: 1px solid rgba(0,198,255,0.35);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 11px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .intel-btn:hover { background: rgba(0,198,255,0.15); border-color: var(--accent); }
    .intel-btn:active { transform: scale(0.96); }
    .intel-btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .intel-btn .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: blink 1s infinite;
      flex-shrink: 0;
    }
    @keyframes scanning {
      0%   { content: '🔍'; }
      33%  { content: '📡'; }
      66%  { content: '⚡'; }
      100% { content: '🔍'; }
    }

    /* Intel chip in empty state */
    .chip.intel {
      background: linear-gradient(135deg, rgba(0,198,255,0.08), rgba(124,92,252,0.08));
      border-color: rgba(0,198,255,0.3);
      color: var(--accent);
      font-weight: 600;
    }
    .chip.intel:hover { background: rgba(0,198,255,0.15); border-color: var(--accent); }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="chat-header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">‹</button>
      <div class="jarvis-badge">
        <div class="j-avatar">🤖</div>
        <div class="j-info">
          <span class="j-name">JARVIS</span>
          <span class="j-status"><span class="status-dot"></span>Online</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button class="intel-btn" id="intel-btn" onclick="scanIntel()">
        <span class="pulse"></span>🌐 Intel
      </button>
      <button class="clear-btn" onclick="onClear()">🗑</button>
    </div>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="messages"></div>

  <!-- INPUT BAR -->
  <div class="input-bar">
    <div id="token-row" class="token-row" style="display:none">
      <input id="token-input" type="password" placeholder="GitHub Token оруул (ghp_...)">
      <button class="token-save-btn" onclick="saveToken()">Хадгал</button>
    </div>
    <div class="input-wrap">
      <textarea id="chat-input" rows="1"
        placeholder="JARVIS-т бич..."
        onkeydown="onKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item" href="index.html"><span class="ni">🏠</span><span>Нүүр</span></a>
    <a class="nav-item" href="tracker.html"><span class="ni">📊</span><span>Tracker</span></a>
    <a class="nav-item" href="dashboard.html"><span class="ni">📈</span><span>Статс</span></a>
    <a class="nav-item active" href="chat.html"><span class="ni">🤖</span><span>Chat</span></a>
    <a class="nav-item" href="profile.html"><span class="ni">👤</span><span>Профайл</span></a>
  </nav>

  <script src="app.js"></script>
  <script src="gemini.js"></script>
  <script src="intel.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const msgsEl  = document.getElementById('messages');
    const inputEl = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    // ── INIT ─────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      checkToken();
      renderHistory();
    });

    function checkToken() {
      const hasProxy = !!localStorage.getItem('jarvis_proxy_url');
      const hasKey   = !!localStorage.getItem('jarvis_chat_key');
      document.getElementById('token-row').style.display = (hasProxy || hasKey) ? 'none' : 'flex';
    }

    function saveToken() {
      const val = document.getElementById('token-input').value.trim();
      if (!val) return;
      localStorage.setItem('jarvis_chat_key', val);
      document.getElementById('token-input').value = '';
      document.getElementById('token-row').style.display = 'none';
      addMsg('bot', '✅ Token хадгалагдлаа! Одоо чатлаж болно.');
    }

    // ── RENDER HISTORY ────────────────────────────────────────────
    function renderHistory() {
      msgsEl.innerHTML = '';
      const history = _loadHistory();

      if (history.length === 0) {
        showEmpty();
        return;
      }

      history.forEach(m => {
        const text = m.content || m.parts?.[0]?.text || '';
        const role = m.role === 'user' ? 'user' : 'bot';
        addMsg(role, text, false);
      });

      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    function showEmpty() {
      msgsEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🤖</div>
          <div class="empty-title">JARVIS бэлэн байна</div>
          <div class="empty-sub">Дасгал, бизнес, хятад хэл —<br>юу ч асуугаарай</div>
          <div class="quick-chips">
            <div class="chip intel" onclick="scanIntel()">🌐 Шуурхай дэлхийн мэдээ</div>
            <div class="chip" onclick="quickSend(this)">📊 Өнөөдрийн байдал</div>
            <div class="chip" onclick="quickSend(this)">💪 Дасгалын зөвлөгөө</div>
            <div class="chip" onclick="quickSend(this)">🏢 LFS стратеги</div>
            <div class="chip" onclick="quickSend(this)">🇨🇳 HSK4 бэлтгэл</div>
          </div>
        </div>`;
    }

    function quickSend(chip) {
      inputEl.value = chip.textContent.slice(2).trim();
      send();
    }

    // ── ADD MESSAGE ───────────────────────────────────────────────
    function addMsg(role, text, scroll = true) {
      // empty state устгана
      const es = msgsEl.querySelector('.empty-state');
      if (es) es.remove();

      const row = document.createElement('div');
      row.className = `msg-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = role === 'user' ? 'Б' : '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      msgsEl.appendChild(row);

      if (scroll) msgsEl.scrollTop = msgsEl.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const es = msgsEl.querySelector('.empty-state');
      if (es) es.remove();

      const row = document.createElement('div');
      row.className = 'msg-row bot';
      row.id = 'typing-row';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = '🤖';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

      row.appendChild(avatar);
      row.appendChild(bubble);
      msgsEl.appendChild(row);
      msgsEl.scrollTop = msgsEl.scrollHeight;
      return row;
    }

    // ── SEND ──────────────────────────────────────────────────────
    async function send() {
      const text = inputEl.value.trim();
      if (!text || sendBtn.disabled) return;

      inputEl.value = '';
      autoResize(inputEl);
      sendBtn.disabled = true;

      addMsg('user', text);

      const typingRow = addTyping();

      const reply = await sendChatMessage(text);

      typingRow.remove();
      addMsg('bot', reply);
      sendBtn.disabled = false;
      inputEl.focus();
    }

    function onKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    // ── INTEL SCAN ────────────────────────────────────────────────
    async function scanIntel() {
      const btn = document.getElementById('intel-btn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<span class="pulse"></span>⏳ Хайж байна...'; }

      const typing = addTyping();

      const reply = await fetchLiveIntel(progress => {
        if (typing && typing.querySelector('.bubble')) {
          typing.querySelector('.bubble').innerHTML =
            `<div style="font-size:12px;color:#64748b">${progress}</div>`;
        }
      });

      typing.remove();
      addMsg('bot', reply);

      if (btn) { btn.disabled = false; btn.innerHTML = '<span class="pulse"></span>🌐 Intel'; }
    }

    // ── CLEAR ─────────────────────────────────────────────────────
    function onClear() {
      if (!confirm('Чат түүхийг устгах уу?')) return;
      clearChatHistory();
      msgsEl.innerHTML = '';
      showEmpty();
    }
  </script>
</body>
</html>
