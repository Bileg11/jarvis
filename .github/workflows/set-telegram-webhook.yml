name: Set Telegram Webhook

# Telegram ботын webhook хаягийг шинэ Vercel URL руу зааж өгнө.
# Ажиллуулах: GitHub → Actions → "Set Telegram Webhook" → Run workflow →
#   url талбарт webhook-ийн үндсэн хаягийг бич (жишээ:
#   https://jarvis-webhook-orcin.vercel.app) → Run.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Webhook үндсэн URL (https://...vercel.app)'
        required: true
        default: 'https://jarvis-webhook-orcin.vercel.app'

jobs:
  set-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Set webhook
        env:
          TG_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TG_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
        run: |
          BASE="${{ github.event.inputs.url }}"
          BASE="${BASE%/}"
          ARGS="url=${BASE}/api/telegram"
          if [ -n "$TG_SECRET" ]; then ARGS="${ARGS}&secret_token=${TG_SECRET}"; fi
          echo "→ setWebhook: ${BASE}/api/telegram (secret: $([ -n \"$TG_SECRET\" ] && echo тийм || echo үгүй))"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/setWebhook?${ARGS}"
          echo ""
          echo "→ getWebhookInfo:"
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/getWebhookInfo" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)['result']
          print('URL:', d.get('url'))
          print('Pending:', d.get('pending_update_count'))
          print('Last error:', d.get('last_error_message', 'байхгүй'))"
