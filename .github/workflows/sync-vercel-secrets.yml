name: Sync Secrets to Vercel

on:
  workflow_dispatch:   # Гараар нэг удаа ажиллуулна

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all secrets to Vercel
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          upsert() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then echo "⚠️  $key хоосон байна, алгасав"; return; fi

            # Байгаа бол устгаж дахин нэм
            curl -s -X DELETE \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env/${key}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" > /dev/null

            RESPONSE=$(curl -s -X POST \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"key\": \"${key}\",
                \"value\": $(echo "$val" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),
                \"type\": \"encrypted\",
                \"target\": [\"production\"]
              }")

            if echo "$RESPONSE" | grep -q '"error"'; then
              echo "❌ $key: $(echo $RESPONSE | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"error\",{}).get(\"message\",\"unknown\"))')"
            else
              echo "✅ $key"
            fi
          }

          upsert "TELEGRAM_BOT_TOKEN_JARVIS" "${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}"
          upsert "TELEGRAM_ID"               "${{ secrets.TELEGRAM_ID }}"
          upsert "FIREBASE_SERVICE_ACCOUNT"  "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          upsert "USER_UID"                  "${{ secrets.USER_UID }}"
          upsert "ACCESS_TOKEN_META"         "${{ secrets.ACCESS_TOKEN_META }}"
          upsert "INSTAGRAM_BUSINESS_ID"     "${{ secrets.INSTAGRAM_BUSINESS_ID }}"
          upsert "FACEBOOK_PAGE_ID"          "${{ secrets.FACEBOOK_PAGE_ID }}"
          upsert "SYSTEM_USE_TOKEN"          "${{ secrets.SYSTEM_USE_TOKEN }}"
          upsert "PEXELS_API_KEY"            "${{ secrets.PEXELS_API_KEY }}"
          upsert "UNSPLASH_ACCESS_KEY"       "${{ secrets.UNSPLASH_ACCESS_KEY }}"
          upsert "NOTION_TOKEN"              "${{ secrets.NOTION_TOKEN }}"
          upsert "NOTION_JARVIS_PAGE_ID"     "${{ secrets.NOTION_JARVIS_PAGE_ID }}"
          upsert "TAVILY_KEY"                "${{ secrets.TAVILY_KEY }}"

          echo ""
          echo "🔄 Redeploy эхлүүлж байна..."
          curl -s -X POST \
            "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"jarvis\",\"gitSource\":{\"type\":\"github\",\"repoId\":\"$(curl -s 'https://api.github.com/repos/Bileg11/jarvis' | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"id\"])')\",\"ref\":\"main\"}}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('✅ Redeploy:', d.get('url','started'))" 2>/dev/null || echo "✅ Secrets sync дууслаа — Vercel-д гараар Redeploy хий"
