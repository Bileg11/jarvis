name: Sync Secrets to Vercel

# GitHub дээрх secret-уудыг Vercel төслийн env рүү зөв синк хийнэ.
# Ажиллуулах: Actions → "Sync Secrets to Vercel" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Vercel төслийн ID (хоосон бол VERCEL_PROJECT_ID secret)'
        required: false
      redeploy:
        description: 'Синкийн дараа дахин deploy хийх үү? (yes/no)'
        default: 'yes'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Secret-уудыг Vercel рүү синк хийх
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ github.event.inputs.project_id || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID:    ${{ secrets.VERCEL_TEAM_ID }}
          # Нууцуудыг S_ угтвартайгаар дамжуулна — скрипт зөвхөн эдгээрийг уншина
          S_TELEGRAM_BOT_TOKEN_JARVIS:  ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          S_TELEGRAM_ID:                ${{ secrets.TELEGRAM_ID }}
          S_FIREBASE_SERVICE_ACCOUNT:   ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          S_USER_UID:                   ${{ secrets.USER_UID }}
          S_ACCESS_TOKEN_META:          ${{ secrets.ACCESS_TOKEN_META }}
          S_INSTAGRAM_BUSINESS_ID:      ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          S_FACEBOOK_PAGE_ID:           ${{ secrets.FACEBOOK_PAGE_ID }}
          S_SYSTEM_USE_TOKEN:           ${{ secrets.SYSTEM_USE_TOKEN }}
          S_PEXELS_API_KEY:             ${{ secrets.PEXELS_API_KEY }}
          S_UNSPLASH_ACCESS_KEY:        ${{ secrets.UNSPLASH_ACCESS_KEY }}
          S_NOTION_TOKEN:               ${{ secrets.NOTION_TOKEN }}
          S_NOTION_JARVIS_PAGE_ID:      ${{ secrets.NOTION_JARVIS_PAGE_ID }}
          S_TAVILY_KEY:                 ${{ secrets.TAVILY_KEY }}
          S_GEMINI_API_KEY:             ${{ secrets.GEMINI_API_KEY }}
          S_TG_WEBHOOK_SECRET:          ${{ secrets.TG_WEBHOOK_SECRET }}
          S_GOOGLE_CLIENT_ID:           ${{ secrets.GOOGLE_CLIENT_ID }}
          S_GOOGLE_CLIENT_SECRET:       ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S_GOOGLE_REFRESH_TOKEN:       ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          S_GOOGLE_REFRESH_TOKEN_GMAIL: ${{ secrets.GOOGLE_REFRESH_TOKEN_GMAIL }}
        run: node scripts/vercel-sync.js

      - name: Дахин deploy хийх
        if: ${{ github.event.inputs.redeploy != 'no' }}
        env:
          VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ github.event.inputs.project_id || secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID:    ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          TEAM=""
          [ -n "$VERCEL_TEAM_ID" ] && TEAM="?teamId=${VERCEL_TEAM_ID}"
          LAST=$(curl -s -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments${TEAM}${TEAM:+&}${TEAM:-?}projectId=${VERCEL_PROJECT_ID}&limit=1&state=READY" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);console.log(d.deployments?.[0]?.uid||'')}catch{console.log('')}})")
          if [ -z "$LAST" ]; then
            echo "Сүүлийн deploy олдсонгүй — Vercel дээр гараар Redeploy хийнэ үү."
            exit 0
          fi
          echo "Сүүлийн deploy: $LAST — дахин deploy хийж байна…"
          curl -s -X POST -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments${TEAM}" \
            -d "{\"deploymentId\":\"${LAST}\",\"name\":\"redeploy\",\"target\":\"production\"}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);console.log(d.url?('✓ Шинэ deploy: '+d.url):('✗ '+(d.error?.message||s.slice(0,200))))}catch{console.log(s.slice(0,200))}})"
