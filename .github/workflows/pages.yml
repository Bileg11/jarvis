name: Deploy JARVIS web → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage web files (no server/webhook/dist)
        run: |
          mkdir -p _site
          cp index.html *.js *.css *.svg manifest.json _site/ 2>/dev/null || true
          cp *.html _site/ 2>/dev/null || true
          cp -r assets _site/assets 2>/dev/null || true
          # SPA fallback (404 → index)
          cp index.html _site/404.html 2>/dev/null || true
          echo "Staged:" && ls _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
