name: JARVIS Pulse

# Railway server.js-ийн cron-уудын орлуулалт (Railway унтарсан).
# ── ЦАГИЙН ТУХАЙ ЧУХАЛ ТЭМДЭГЛЭЛ ──────────────────────────────────
# GitHub-ийн үнэгүй хуваарь цагийн ЭХЭНД (:00) их ачаалалтай тул
# мессежийг 1-5 цаг хойшлуулдаг. Тийм учраас бүх ажлыг цагийн
# эхнээс ЗӨӨСӨН (:07, :09, :20) — хойшлолт мэдэгдэхүйц багасна.
# Цаг нь UTC. Шанхай = UTC+8.
#   */5   — Execution Engine tick + outbox + checkpoints
#   13 22 — 06:13 Шанхай: өглөөний brief (шинэ)
#   7 7   — 15:07 Шанхай: HSK өдрийн сануулга
#   9 14  — 22:09 Шанхай: өдрийн тайлан (recap)
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '13 22 * * *'
    - cron: '7 7 * * *'
    - cron: '9 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'tick | morning | hsk | recap'
        default: 'tick'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: webhook/package-lock.json
      - run: npm ci --prefix webhook

      - name: Determine mode
        id: mode
        run: |
          MODE=tick
          [ "${{ github.event.schedule }}" = "13 22 * * *" ] && MODE=morning
          [ "${{ github.event.schedule }}" = "7 7 * * *" ]   && MODE=hsk
          [ "${{ github.event.schedule }}" = "9 14 * * *" ]  && MODE=recap
          [ -n "${{ github.event.inputs.mode }}" ] && MODE="${{ github.event.inputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Run pulse (${{ steps.mode.outputs.mode }})
        env:
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN_JARVIS: ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TELEGRAM_ID:               ${{ secrets.TELEGRAM_ID }}
          USER_UID:                  ${{ secrets.USER_UID }}
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
        run: node webhook/pulse.js ${{ steps.mode.outputs.mode }}
