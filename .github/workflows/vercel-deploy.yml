name: Vercel руу deploy хийх

# chat-proxy болон webhook нь GitHub push дээр АВТОМАТААР deploy болдоггүй
# (Git integration холбогдоогүй) тул энэ ажил гараар/дуудаж deploy хийнэ.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Аль нь? chat-proxy | webhook | both'
        default: 'both'
  push:
    branches: [main]
    paths:
      - 'chat-proxy/**'
      - 'webhook/**'

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy
        env:
          VERCEL_TOKEN:  ${{ secrets.VERCEL_TOKEN }}
          # Эдгээр нь нууц биш — зөвхөн танигч. Нууц нь зөвхөн VERCEL_TOKEN.
          VERCEL_ORG_ID: team_s86fhrVVSRHkHsw6O9YCJ9Pi
          PRJ_CHAT:      prj_pvmivuIHs6AQnEFY3W0k1hg9Eb8N
          PRJ_HOOK:      prj_bL9nY62wRIZGs861DPbYPUrDRuwm
          TARGET:        ${{ github.event.inputs.target || 'both' }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ]; then
            echo "VERCEL_TOKEN эсвэл VERCEL_ORG_ID байхгүй — алгаслаа."; exit 0
          fi

          deploy () {
            local DIR="$1" PRJ="$2" NAME="$3"
            if [ -z "$PRJ" ]; then echo "⚠ $NAME: project id байхгүй, алгаслаа"; return; fi
            echo "── $NAME ($DIR) ──"
            # Vercel CLI нь ORG_ID, PROJECT_ID ХОЁУЛАНГ нь env-ээс шаарддаг
            ( cd "$DIR" && VERCEL_PROJECT_ID="$PRJ" VERCEL_ORG_ID="$VERCEL_ORG_ID" \
                npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" )
          }

          case "$TARGET" in
            chat-proxy) deploy chat-proxy "$PRJ_CHAT" "chat-proxy" ;;
            webhook)    deploy webhook    "$PRJ_HOOK" "webhook" ;;
            *)          deploy chat-proxy "$PRJ_CHAT" "chat-proxy"
                        deploy webhook    "$PRJ_HOOK" "webhook" ;;
          esac
