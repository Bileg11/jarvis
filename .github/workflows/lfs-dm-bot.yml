name: LFS DM Bot

# ⚠️  DISABLED — Meta App Review зөвшөөрөл хүлээж байна
# instagram_manage_messages permission авсны дараа идэвхжүүлнэ:
# on.schedule comment-г арилгана

on:
  # schedule:
  #   - cron: '*/5 * * * *'   # 5 минут тутамд IG DM шалгана
  workflow_dispatch:           # Гараар тест хийх боломж

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dm-reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix scripts
      - name: Reply to Instagram DMs
        env:
          INSTAGRAM_BUSINESS_ID:     ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          ACCESS_TOKEN_META:         ${{ secrets.ACCESS_TOKEN_META }}
          TELEGRAM_BOT_TOKEN_JARVIS: ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TELEGRAM_ID:               ${{ secrets.TELEGRAM_ID }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          SYSTEM_USE_TOKEN:          ${{ secrets.SYSTEM_USE_TOKEN }}
        run: NODE_PATH=./scripts/node_modules node scripts/lfs-dm-bot.js
