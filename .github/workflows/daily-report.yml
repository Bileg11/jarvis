name: Өдрийн тайлан

# Өдрийн бүх датаг цуглуулж reports/YYYY-MM-DD.md болгон репод хадгална.
# Энэ файлыг Claude уншиж зөвлөгөө өгнө.
on:
  schedule:
    - cron: '40 14 * * *'   # 22:40 Улаанбаатар — өдрийн ажил дууссаны дараа
  workflow_dispatch:
    inputs:
      date:
        description: 'Огноо (YYYY-MM-DD), хоосон бол өнөөдөр'
        required: false
      debug:
        description: 'Эрхийн оношлогоо ажиллуулах уу? (yes)'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-report

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix scripts

      - name: Тайлан үүсгэх
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                 ${{ secrets.USER_UID }}
        run: node scripts/daily-report.js ${{ github.event.inputs.date }}

      - name: Оношлогоо (хүсвэл)
        if: ${{ github.event.inputs.debug == 'yes' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                 ${{ secrets.USER_UID }}
        run: node scripts/debug-uid.js

      - name: Хадгалах
        run: |
          git config user.name  "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Өөрчлөлт алга"
          else
            git commit -m "report: өдрийн тайлан $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
