name: Jarvis Daily Briefing

on:
  schedule:
    - cron: '0 23 * * *'   # 07:00 Shanghai (UTC+8)
    - cron: '0 5 * * *'    # 13:00 Shanghai
    - cron: '0 13 * * *'   # 21:00 Shanghai
  workflow_dispatch:         # Manual trigger for testing

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Debug — verify script version
        run: grep -n "GEMINI_ENDPOINTS\|gemini-" scripts/briefing.js

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Run Jarvis briefing
        env:
          GEMINI_KEY:                ${{ secrets.GEMINI_KEY }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          TELEGRAM_TOKEN:            ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:          ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/briefing.js
