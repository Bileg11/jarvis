name: Jarvis Daily Briefing

on:
  schedule:
    - cron: '0 23 * * *'   # 07:00 Shanghai
    - cron: '0 5 * * *'    # 13:00 Shanghai
    - cron: '0 13 * * *'   # 21:00 Shanghai
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --prefix scripts

      - name: Run Jarvis briefing
        env:
          GITHUB_TOKEN:              ${{ secrets.GITHUB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          TELEGRAM_BOT_TOKEN_JARVIS: ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TELEGRAM_ID:               ${{ secrets.TELEGRAM_ID }}
          SYSTEM_USE_TOKEN:          ${{ secrets.SYSTEM_USE_TOKEN }}
          TAVILY_KEY:                ${{ secrets.TAVILY_KEY }}
        run: node scripts/briefing.js
