name: JARVIS Weekly Planner

on:
  schedule:
    - cron: '0 23 * * 0'   # Даваа 07:00 Shanghai (Ням 23:00 UTC)
  workflow_dispatch:         # Гараар дуудах боломж

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix scripts
      - name: Generate weekly post plan
        env:
          TELEGRAM_BOT_TOKEN_JARVIS: ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TELEGRAM_ID:               ${{ secrets.TELEGRAM_ID }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          SYSTEM_USE_TOKEN:          ${{ secrets.SYSTEM_USE_TOKEN }}
          TAVILY_KEY:                ${{ secrets.TAVILY_KEY }}
        run: NODE_PATH=./scripts/node_modules node scripts/weekly-planner.js
