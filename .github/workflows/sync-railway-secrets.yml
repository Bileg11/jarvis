name: Sync Secrets to Railway

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Vercel env vars to Railway
        env:
          VERCEL_TOKEN:        ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID:   ${{ secrets.VERCEL_PROJECT_ID }}
          RAILWAY_TOKEN:       ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID:  ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID:  ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID:      ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          vercel_token    = os.environ["VERCEL_TOKEN"]
          vercel_project  = os.environ["VERCEL_PROJECT_ID"]
          railway_token   = os.environ["RAILWAY_TOKEN"]
          railway_project = os.environ["RAILWAY_PROJECT_ID"]
          railway_service = os.environ["RAILWAY_SERVICE_ID"]
          railway_env     = os.environ["RAILWAY_ENV_ID"]

          # 1. Vercel-с env var жагсаалт авна
          req = urllib.request.Request(
            f"https://api.vercel.com/v9/projects/{vercel_project}/env?limit=100",
            headers={"Authorization": f"Bearer {vercel_token}"}
          )
          with urllib.request.urlopen(req) as r:
            envs = json.loads(r.read())["envs"]

          print(f"Vercel-с {len(envs)} env var олдлоо\n")

          # 2. Тус бүрийн утгыг decrypt хийж авна
          mutation = """
          mutation variableUpsert($input: VariableUpsertInput!) {
            variableUpsert(input: $input)
          }
          """

          for env in envs:
            key = env["key"]
            env_id_vercel = env["id"]

            # Decrypt value авна
            try:
              r2 = urllib.request.Request(
                f"https://api.vercel.com/v1/projects/{vercel_project}/env/{env_id_vercel}",
                headers={"Authorization": f"Bearer {vercel_token}"}
              )
              with urllib.request.urlopen(r2) as resp:
                val = json.loads(resp.read()).get("value", "")
            except Exception as e:
              print(f"⚠️  {key} Vercel-с авч чадсангүй: {e}")
              continue

            if not val:
              print(f"⚠️  {key} хоосон, алгасав")
              continue

            # Railway-д бичнэ
            payload = json.dumps({
              "query": mutation,
              "variables": {
                "input": {
                  "projectId":     railway_project,
                  "environmentId": railway_env,
                  "serviceId":     railway_service,
                  "name":          key,
                  "value":         val,
                }
              }
            }).encode("utf-8")

            req3 = urllib.request.Request(
              "https://backboard.railway.app/graphql/v2",
              data=payload,
              headers={
                "Authorization": f"Bearer {railway_token}",
                "Content-Type":  "application/json",
              }
            )
            try:
              with urllib.request.urlopen(req3) as resp:
                data = json.loads(resp.read())
                if "errors" in data:
                  print(f"❌ {key}: {data['errors'][0]['message']}")
                else:
                  print(f"✅ {key}")
            except Exception as e:
              print(f"❌ {key}: {e}")

          print("\n✅ Sync дууслаа!")
          EOF
