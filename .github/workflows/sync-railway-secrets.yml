name: Sync Secrets to Railway

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all secrets to Railway
        env:
          RAILWAY_TOKEN:       ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID:  ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID:  ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID:      ${{ secrets.RAILWAY_ENV_ID }}
          TELEGRAM_BOT_TOKEN_JARVIS: ${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}
          TELEGRAM_ID:               ${{ secrets.TELEGRAM_ID }}
          FIREBASE_SERVICE_ACCOUNT:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          USER_UID:                  ${{ secrets.USER_UID }}
          ACCESS_TOKEN_META:         ${{ secrets.ACCESS_TOKEN_META }}
          INSTAGRAM_BUSINESS_ID:     ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          FACEBOOK_PAGE_ID:          ${{ secrets.FACEBOOK_PAGE_ID }}
          SYSTEM_USE_TOKEN:          ${{ secrets.SYSTEM_USE_TOKEN }}
          PEXELS_API_KEY:            ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY:       ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NOTION_TOKEN:              ${{ secrets.NOTION_TOKEN }}
          NOTION_JARVIS_PAGE_ID:     ${{ secrets.NOTION_JARVIS_PAGE_ID }}
          TAVILY_KEY:                ${{ secrets.TAVILY_KEY }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, urllib.error

          token      = os.environ["RAILWAY_TOKEN"]
          project_id = os.environ["RAILWAY_PROJECT_ID"]
          service_id = os.environ["RAILWAY_SERVICE_ID"]
          env_id     = os.environ["RAILWAY_ENV_ID"]

          secrets = {
            "TELEGRAM_BOT_TOKEN_JARVIS": os.environ.get("TELEGRAM_BOT_TOKEN_JARVIS",""),
            "TELEGRAM_ID":               os.environ.get("TELEGRAM_ID",""),
            "FIREBASE_SERVICE_ACCOUNT":  os.environ.get("FIREBASE_SERVICE_ACCOUNT",""),
            "USER_UID":                  os.environ.get("USER_UID",""),
            "ACCESS_TOKEN_META":         os.environ.get("ACCESS_TOKEN_META",""),
            "INSTAGRAM_BUSINESS_ID":     os.environ.get("INSTAGRAM_BUSINESS_ID",""),
            "FACEBOOK_PAGE_ID":          os.environ.get("FACEBOOK_PAGE_ID",""),
            "SYSTEM_USE_TOKEN":          os.environ.get("SYSTEM_USE_TOKEN",""),
            "PEXELS_API_KEY":            os.environ.get("PEXELS_API_KEY",""),
            "UNSPLASH_ACCESS_KEY":       os.environ.get("UNSPLASH_ACCESS_KEY",""),
            "NOTION_TOKEN":              os.environ.get("NOTION_TOKEN",""),
            "NOTION_JARVIS_PAGE_ID":     os.environ.get("NOTION_JARVIS_PAGE_ID",""),
            "TAVILY_KEY":                os.environ.get("TAVILY_KEY",""),
          }

          mutation = """
          mutation variableUpsert($input: VariableUpsertInput!) {
            variableUpsert(input: $input)
          }
          """

          for key, val in secrets.items():
            if not val:
              print(f"⚠️  {key} хоосон, алгасав")
              continue

            payload = json.dumps({
              "query": mutation,
              "variables": {
                "input": {
                  "projectId":     project_id,
                  "environmentId": env_id,
                  "serviceId":     service_id,
                  "name":          key,
                  "value":         val,
                }
              }
            }).encode("utf-8")

            req = urllib.request.Request(
              "https://backboard.railway.app/graphql/v2",
              data=payload,
              headers={
                "Authorization": f"Bearer {token}",
                "Content-Type":  "application/json",
              }
            )
            try:
              with urllib.request.urlopen(req) as resp:
                data = json.loads(resp.read())
                if "errors" in data:
                  print(f"❌ {key}: {data['errors'][0]['message']}")
                else:
                  print(f"✅ {key}")
            except Exception as e:
              print(f"❌ {key}: {e}")

          print("\n✅ Railway secrets sync дууслаа!")
          EOF
