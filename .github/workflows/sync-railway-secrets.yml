name: Sync Secrets to Railway

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync all secrets to Railway
        env:
          RAILWAY_TOKEN:       ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID:  ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID:  ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENV_ID:      ${{ secrets.RAILWAY_ENV_ID }}
        run: |
          upsert() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then echo "⚠️  $key хоосон, алгасав"; return; fi

            RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"query\": \"mutation { variableUpsert(input: { projectId: \\\"${RAILWAY_PROJECT_ID}\\\", environmentId: \\\"${RAILWAY_ENV_ID}\\\", serviceId: \\\"${RAILWAY_SERVICE_ID}\\\", name: \\\"${key}\\\", value: $(echo "$val" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().rstrip()))') }) }\"
              }")

            if echo "$RESPONSE" | grep -q '"errors"'; then
              echo "❌ $key: $(echo $RESPONSE | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["errors"][0]["message"])' 2>/dev/null || echo 'unknown error')"
            else
              echo "✅ $key"
            fi
          }

          upsert "TELEGRAM_BOT_TOKEN_JARVIS" "${{ secrets.TELEGRAM_BOT_TOKEN_JARVIS }}"
          upsert "TELEGRAM_ID"               "${{ secrets.TELEGRAM_ID }}"
          upsert "FIREBASE_SERVICE_ACCOUNT"  "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          upsert "USER_UID"                  "${{ secrets.USER_UID }}"
          upsert "ACCESS_TOKEN_META"         "${{ secrets.ACCESS_TOKEN_META }}"
          upsert "INSTAGRAM_BUSINESS_ID"     "${{ secrets.INSTAGRAM_BUSINESS_ID }}"
          upsert "FACEBOOK_PAGE_ID"          "${{ secrets.FACEBOOK_PAGE_ID }}"
          upsert "SYSTEM_USE_TOKEN"          "${{ secrets.SYSTEM_USE_TOKEN }}"
          upsert "PEXELS_API_KEY"            "${{ secrets.PEXELS_API_KEY }}"
          upsert "UNSPLASH_ACCESS_KEY"       "${{ secrets.UNSPLASH_ACCESS_KEY }}"
          upsert "NOTION_TOKEN"              "${{ secrets.NOTION_TOKEN }}"
          upsert "NOTION_JARVIS_PAGE_ID"     "${{ secrets.NOTION_JARVIS_PAGE_ID }}"
          upsert "TAVILY_KEY"                "${{ secrets.TAVILY_KEY }}"

          echo ""
          echo "✅ Railway secrets sync дууслаа!"
          echo "🔄 Railway автоматаар redeploy хийнэ."
