<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Профайл — Jarvis</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script>
    // Firebase-г энд init хийнэ (firebase-config.js-г ашиглахгүй)
    const _FC = {
      apiKey:            "AIzaSyA0AwSRMmKQsRfLoY9CreGKrm3CXn0FHTc",
      authDomain:        "jarvis-bileg.firebaseapp.com",
      projectId:         "jarvis-bileg",
      storageBucket:     "jarvis-bileg.firebasestorage.app",
      messagingSenderId: "59304492638",
      appId:             "1:59304492638:web:9da4e7ceac790d1254becf"
    };
    firebase.initializeApp(_FC);
  </script>
</head>
<body>

  <header class="header">
    <div>
      <h1>Профайл</h1>
      <div class="sub">Дансны мэдээлэл</div>
    </div>
    <div class="avatar" id="p-avatar-sm">?</div>
  </header>

  <div class="profile-wrap">

    <!-- ACCOUNT CARD -->
    <div class="profile-card">
      <div class="profile-avatar-big" id="p-avatar-big">?</div>
      <div class="profile-name"  id="p-name">Уншиж байна...</div>
      <div class="profile-email" id="p-email"></div>
      <div class="profile-uid"   id="p-uid"></div>
    </div>

    <!-- CHAT KEY (GitHub PAT → gpt-4o-mini) -->
    <div class="sec-label" style="margin-top:20px">💬 JARVIS Chat</div>
    <div class="profile-section">
      <div class="ps-row">
        <span class="ps-label">GitHub Token</span>
        <span class="ps-val" id="chat-key-status">—</span>
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:8px">github.com → Settings → Developer settings → Personal access tokens → ghp_...</div>
      <div class="ps-key-row">
        <input id="prof-chat-key" type="password" placeholder="ghp_..." class="ps-input">
        <button onclick="saveChatKey()" class="ps-btn">Хадгал</button>
      </div>
      <button onclick="clearChatKey()" class="ps-btn-danger" id="clear-chat-key-btn" style="display:none">🗑 Token устгах</button>
    </div>

    <!-- GEMINI KEY (briefing only) -->
    <div class="sec-label" style="margin-top:20px">🤖 Briefing (Gemini)</div>
    <div class="profile-section">
      <div class="ps-row">
        <span class="ps-label">Gemini API Key</span>
        <span class="ps-val" id="key-status">—</span>
      </div>
      <div style="font-size:11px;color:#888;margin-bottom:8px">aistudio.google.com → Get API key</div>
      <div class="ps-key-row">
        <input id="prof-key" type="password" placeholder="AIza..." class="ps-input">
        <button onclick="saveKey()" class="ps-btn">Хадгал</button>
      </div>
      <button onclick="clearKey()" class="ps-btn-danger" id="clear-key-btn" style="display:none">🗑 Key устгах</button>
    </div>

    <!-- ACTIONS -->
    <div class="sec-label" style="margin-top:20px">Үйлдэл</div>
    <div class="profile-section">
      <button class="ps-action-btn" onclick="clearChat()">🗑 Чат түүх цэвэрлэх</button>
      <button class="ps-action-btn danger" onclick="doSignOut()">🚪 Гарах</button>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a class="nav-item"        href="index.html">    <span class="ni">🏠</span><span>Нүүр</span></a>
    <a class="nav-item"        href="tracker.html">  <span class="ni">📊</span><span>Tracker</span></a>
    <a class="nav-item"        href="dashboard.html"><span class="ni">📈</span><span>Статс</span></a>
    <a class="nav-item"        href="index.html">    <span class="ni" style="font-family:serif">汉</span><span>汉字</span></a>
    <a class="nav-item active" href="profile.html">  <span class="ni">👤</span><span>Профайл</span></a>
  </nav>

  <div id="toast"></div>

  <!-- LOGIN MODAL (нэвтрээгүй бол) -->
  <div id="login-modal" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px)">
    <div class="login-box">
      <div class="login-title">🔐 JARVIS</div>
      <input id="lm-email" type="email"    placeholder="Email"    autocomplete="email">
      <input id="lm-pass"  type="password" placeholder="Нууц үг" autocomplete="current-password">
      <button id="lm-btn" onclick="doLogin()">Нэвтрэх</button>
      <div id="lm-err" class="lm-err"></div>
    </div>
  </div>

  <script>
    const _auth = firebase.auth();

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function renderUser(user) {
      const modal = document.getElementById('login-modal');
      if (!user) { modal.style.display = 'flex'; return; }
      modal.style.display = 'none';

      const letter = user.email ? user.email[0].toUpperCase() : '?';
      document.getElementById('p-avatar-sm').textContent  = letter;
      document.getElementById('p-avatar-big').textContent = letter;
      document.getElementById('p-name').textContent  = user.email ? user.email.split('@')[0] : 'Anonymous';
      document.getElementById('p-email').textContent = user.email || 'Нэвтрэх email байхгүй';
      document.getElementById('p-uid').textContent   = 'UID: ' + user.uid.slice(0,12) + '...';

      // GitHub chat key
      const chatKey = localStorage.getItem('jarvis_chat_key') || '';
      document.getElementById('chat-key-status').textContent = chatKey ? '✅ ' + chatKey.slice(0,10) + '...' : '❌ Тавигдаагүй';
      document.getElementById('clear-chat-key-btn').style.display = chatKey ? 'block' : 'none';

      // Gemini briefing key
      const key = localStorage.getItem('jarvis_gemini_key') || '';
      const keyEl = document.getElementById('key-status');
      const clearBtn = document.getElementById('clear-key-btn');
      keyEl.textContent = key ? '✅ ' + key.slice(0,8) + '...' : '❌ Тавигдаагүй';
      clearBtn.style.display = key ? 'block' : 'none';
    }

    _auth.onAuthStateChanged(renderUser);

    // Enter → нэвтрэх
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && document.getElementById('login-modal').style.display !== 'none') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('lm-email').value.trim();
      const pass  = document.getElementById('lm-pass').value;
      const errEl = document.getElementById('lm-err');
      const btn   = document.getElementById('lm-btn');
      if (!email || !pass) { errEl.textContent = 'Email болон нууц үг оруулна уу'; return; }
      btn.textContent = '...'; btn.disabled = true;
      try {
        await _auth.signInWithEmailAndPassword(email, pass);
      } catch(e) {
        btn.textContent = 'Нэвтрэх'; btn.disabled = false;
        errEl.textContent =
          e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'
            ? 'Email эсвэл нууц үг буруу'
            : 'Алдаа: ' + e.message;
      }
    }

    function saveChatKey() {
      const val = document.getElementById('prof-chat-key').value.trim();
      if (!val) return;
      localStorage.setItem('jarvis_chat_key', val);
      document.getElementById('prof-chat-key').value = '';
      renderUser(_auth.currentUser);
      showToast('✅ GitHub Token хадгалагдлаа');
    }

    function clearChatKey() {
      if (!confirm('GitHub Token устгах уу?')) return;
      localStorage.removeItem('jarvis_chat_key');
      renderUser(_auth.currentUser);
      showToast('🗑 Token устгагдлаа');
    }

    function saveKey() {
      const val = document.getElementById('prof-key').value.trim();
      if (!val) return;
      localStorage.setItem('jarvis_gemini_key', val);
      document.getElementById('prof-key').value = '';
      renderUser(_auth.currentUser);
      showToast('✅ Gemini key хадгалагдлаа');
    }

    function clearKey() {
      if (!confirm('Gemini key устгах уу?')) return;
      localStorage.removeItem('jarvis_gemini_key');
      renderUser(_auth.currentUser);
      showToast('🗑 Key устгагдлаа');
    }

    function clearChat() {
      if (!confirm('Чат түүхийг устгах уу?')) return;
      localStorage.removeItem('jarvis_chat_history');
      showToast('🗑 Чат цэвэрлэгдлээ');
    }

    function doSignOut() {
      if (!confirm('Гарах уу?')) return;
      _auth.signOut();
    }
  </script>
</body>
</html>
