<script>/* Өдрийн зааг — ОРОН НУТГИЙН цагаар. Хуудсанд шууд бичсэн нь
   кэшнээс болж тодорхойлогдоогүй үлдэхээс сэргийлнэ. */
window.jarvisDay=function(d){d=d||new Date();return d.getFullYear()+'-'+
String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};</script>

<body class="ds">

<main class="jv-page">

  <header class="jv-head">
    <div class="jv-date" id="h-date">—</div>

  <!-- ── Гурван тоо ─────────────────────────────────────────────── -->

    </div>

    </div>

      <h2>Сүүлийн 7 хоног</h2>
      <span id="w-avg"></span>
    </div>
    <div class="jv-card">
      <div class="jv-week" id="w-week"></div>

<script>
// ── АНХНЫ ТОХИРГОО ────────────────────────────────────────────────
// Тохиргоогоо хийгээгүй хүнийг эхлээд тохиргооны урсгал руу явуулна.
// (Өмнө нь тохиргоо хуучин самбарын дотор нуугдсан тул шинэ хүн
//  нэр, зорилго, AI түлхүүргүй үлдэж, Jarvis чат ажиллахгүй байв.)
(function () {
  var done = false;
  try { done = localStorage.getItem('jarvis_setup_complete') === '1'; } catch (e) {}
  if (!done) {
    location.replace(window.jarvisHref ? jarvisHref('index') : 'index.html');
  }
})();
</script>
<script src="jarvis-shell.js" data-page="home"></script>
<script>
'use strict';

// ── Огноо туслах ──────────────────────────────────────────────────
function jvDay(offset) {
  var d = new Date();
  d.setDate(d.getDate() - (offset || 0));
  return d.getFullYear() + '-' +
         String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}
function jvToday() { return jvDay(0); }

// ── Өдрийн дэвтэр — index.html-тэй ЯГ ижил түлхүүр, ижил бүтэц ────
function jvLoad() {
  try {
    var s = JSON.parse(localStorage.getItem('jarvis_r'));
    if (s && s.date === jvToday()) return s;
  } catch (e) {}
  return { date: jvToday(), water: 0, exercise: false, hanzi: false, read: false, journal: false };
}
function jvSave(r) {
  localStorage.setItem('jarvis_r', JSON.stringify(r));
  localStorage.setItem('jarvis_r_' + r.date, JSON.stringify(r));
  try { window.DB && window.DB.saveRoutine && window.DB.saveRoutine(r); } catch (e) {}
}

// Онооны томьёо — app.js-ийн getDailyScore()-той ижил
function jvScore(r, dateStr) {
  if (!r) return 0;
  var cups = (typeof jvCups === 'function') ? jvCups() : 8;
  var s = Math.round((Math.min(r.water || 0, cups) / cups) * 25);
  if (r.exercise) s += 20;
  if (r.hanzi)    s += 20;
  if (r.read)     s += 15;
  if (r.journal)  s += 10;
  try {
    var log = JSON.parse(localStorage.getItem('jarvis_log_' + (dateStr || jvToday())) || 'null');
    if (log && log.shower) s += 10;
  } catch (e) {}
  return Math.min(100, s);
}

function jvStreak() {
  // HSK давталтын тасралтгүй хоног (hsk.html-ийн түлхүүр)
  try {
    var s = JSON.parse(localStorage.getItem('jarvis_hsk_streak') || 'null');
    if (s && typeof s.count === 'number') {
      var ok = s.last === jvToday() || s.last === jvDay(1);
      return ok ? s.count : 0;
    }
  } catch (e) {}
  return 0;
}


// ══ УС ═════════════════════════════════════════════════════════════
// Ус хоёр газар бүртгэгддэг байсан: нүүр хуудсанд аягаар,
// Тэмдэглэл хуудсанд мл-ээр. Одоо НЭГ дата — мл нь гол,
// аяга нь зөвхөн харуулах хэлбэр. Хаанаас нэмсэн ч хоёул харагдана.
function jvCfg() {
  var c = { goalMl: 2000, cupMl: 250 };
  try {
    var v = JSON.parse(localStorage.getItem('jarvis_water_cfg') || 'null');
    if (v && v.goalMl > 0 && v.cupMl > 0) c = v;
  } catch (e) {}
  // Зорилтыг Тэмдэглэл хуудас өдрийн бүртгэлдээ хадгалдаг — тэр нь давуу
  var log = jvLog0();
  if (log && log.water && log.water.goal_ml > 0) c.goalMl = log.water.goal_ml;
  return c;
}
function jvSaveCfg(c) {
  localStorage.setItem('jarvis_water_cfg', JSON.stringify(c));
  var log = jvLog0() || {};
  log.date  = jvToday();
  log.water = log.water || { total_ml: 0, goal_ml: c.goalMl, entries: [] };
  log.water.goal_ml = c.goalMl;
  jvSaveLog0(log);
}
function jvLog0() {
  try { return JSON.parse(localStorage.getItem('jarvis_log_' + jvToday()) || 'null'); }
  catch (e) { return null; }
}
function jvSaveLog0(log) {
  localStorage.setItem('jarvis_log_' + jvToday(), JSON.stringify(log));
  try { window.DB && window.DB.saveLog && window.DB.saveLog(jvToday(), log); } catch (e) {}
}
function jvCups() { var c = jvCfg(); return Math.max(1, Math.round(c.goalMl / c.cupMl)); }

// Өнөөдөр уусан ус (мл)
function jvWaterMl() {
  var log = jvLog0();
  if (log && log.water && typeof log.water.total_ml === 'number') return log.water.total_ml;
  return (jvLoad().water || 0) * jvCfg().cupMl;   // хуучин дата — аягаас хөрвүүлнэ
}
// Ус нэмэх / тохируулах — хоёр газарт зэрэг бичнэ
function jvSetWaterMl(ml) {
  var c = jvCfg();
  ml = Math.max(0, Math.round(ml));
  var log = jvLog0() || { date: jvToday(), sleep: {}, shower: false, study: [], note: '' };
  log.date  = jvToday();
  log.water = log.water || { total_ml: 0, goal_ml: c.goalMl, entries: [] };
  var diff = ml - (log.water.total_ml || 0);
  if (diff > 0) {
    log.water.entries = log.water.entries || [];
    // Тэмдэглэл хуудасны хэлбэртэй ижил байх ёстой: { id, time, ml }
    var n = new Date();
    log.water.entries.push({
      id: Date.now(), ml: diff,
      time: String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0')
    });
  }
  log.water.total_ml = ml;
  log.water.goal_ml  = c.goalMl;
  jvSaveLog0(log);

  var r = jvLoad();
  r.water = Math.round(ml / c.cupMl);   // хуучин оноо, streak-д хэрэгтэй
  jvSave(r);
}

// ══ ДАСГАЛ ═════════════════════════════════════════════════════════
var JV_WORKOUTS = ['Цээж','Нуруу','Хөл','Мөр','Гар','Гэдэс','Бүтэн бие','Гүйлт','Алхалт','Амралт'];

function jvPlan() {
  try {
    var p = JSON.parse(localStorage.getItem('jarvis_workout_plan') || 'null');
    if (p) return p;
  } catch (e) {}
  return { 0:'Амралт', 1:'Цээж', 2:'Нуруу', 3:'Хөл', 4:'Мөр', 5:'Бүтэн бие', 6:'Амралт' };
}
function jvSavePlan(p) { localStorage.setItem('jarvis_workout_plan', JSON.stringify(p)); }
function jvTodayPlan() { return jvPlan()[new Date().getDay()] || ''; }

function jvLog(dateStr) {
  try { return JSON.parse(localStorage.getItem('jarvis_workout_' + (dateStr || jvToday())) || 'null'); }
  catch (e) { return null; }
}
function jvSaveLog(log) {
  localStorage.setItem('jarvis_workout_' + jvToday(), JSON.stringify(log));
}

// ══ ДООРООС ГАРАХ САМБАР ═══════════════════════════════════════════
var _sheet = null, _sheetBack = null;
function jvSheet(title, sub, bodyHtml, onDone) {
  jvCloseSheet();
  _sheetBack = document.createElement('div');
  _sheetBack.className = 'jv-sheet-back';
  _sheetBack.addEventListener('click', jvCloseSheet);

  _sheet = document.createElement('div');
  _sheet.className = 'jv-sheet';
  _sheet.setAttribute('role', 'dialog');
  _sheet.innerHTML = '<div class="jv-sheet-grip"></div><h2>' + title + '</h2>' +
                     '<p class="sub">' + sub + '</p>' + bodyHtml +
                     '<button class="jv-sheet-done">Болсон</button>';

  document.body.appendChild(_sheetBack);
  document.body.appendChild(_sheet);
  requestAnimationFrame(function () {
    _sheetBack.classList.add('in'); _sheet.classList.add('in');
  });
  _sheet.querySelector('.jv-sheet-done').addEventListener('click', function () {
    if (onDone) onDone(_sheet);
    jvCloseSheet();
    renderAll();
  });
  document.addEventListener('keydown', _sheetKey);
}
function _sheetKey(e) { if (e.key === 'Escape') jvCloseSheet(); }
function jvCloseSheet() {
  document.removeEventListener('keydown', _sheetKey);
  [_sheet, _sheetBack].forEach(function (el) {
    if (!el) return;
    el.classList.remove('in');
    setTimeout(function () { el.remove(); }, 250);
  });
  _sheet = _sheetBack = null;
}

// ── Усны самбар ───────────────────────────────────────────────────
function jvWaterSheet() {
  var c = jvCfg();
  jvSheet('Ус', 'Өдрийн зорилтоо болон аяганыхаа хэмжээг тохируул.',
    '<div class="jv-field"><label>Өдрийн зорилт</label>' +
      '<div class="jv-num"><input id="w-goal" type="number" min="200" max="6000" step="100" value="' + c.goalMl + '"><span>мл</span></div></div>' +
    '<div class="jv-field"><label>Нэг аяга / шил</label>' +
      '<div class="jv-num"><input id="w-cup" type="number" min="50" max="1500" step="50" value="' + c.cupMl + '"><span>мл</span></div></div>' +
    '<div class="jv-field"><label>Өнөөдөр уусан</label>' +
      '<div class="jv-num"><input id="w-now" type="number" min="0" max="8000" step="50" value="' + jvWaterMl() + '"><span>мл</span></div></div>',
    function (sh) {
      var goal = parseInt(sh.querySelector('#w-goal').value, 10);
      var cup  = parseInt(sh.querySelector('#w-cup').value, 10);
      var now  = parseInt(sh.querySelector('#w-now').value, 10);
      if (goal > 0 && cup > 0) jvSaveCfg({ goalMl: goal, cupMl: cup });
      if (!isNaN(now)) jvSetWaterMl(now);
    });
}

// ── Дасгалын самбар ───────────────────────────────────────────────
function jvWorkoutSheet() {
  var log = jvLog() || { type: jvTodayPlan(), mins: 45 };
  var chips = JV_WORKOUTS.map(function (t) {
    return '<button class="jv-chip' + (t === log.type ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>';
  }).join('');

  jvSheet('Дасгал', 'Ямар дасгал хийснээ тэмдэглэ.',
    '<div class="jv-field"><label>Төрөл</label><div class="jv-chips" id="w-types">' + chips + '</div></div>' +
    '<div class="jv-field"><label>Хугацаа</label>' +
      '<div class="jv-num"><input id="w-mins" type="number" min="5" max="300" step="5" value="' + (log.mins || 45) + '"><span>минут</span></div></div>' +
    '<div class="jv-field"><button class="jv-chip" id="w-open-plan" style="width:100%">Долоо хоногийн төлөвлөгөө →</button></div>',
    function (sh) {
      var on = sh.querySelector('.jv-chip.on');
      var mins = parseInt(sh.querySelector('#w-mins').value, 10) || 45;
      jvSaveLog({ type: on ? on.dataset.t : jvTodayPlan(), mins: mins });
      var rr = jvLoad();
      rr.exercise = true;
      jvSave(rr);
    });

  _sheet.querySelector('#w-types').addEventListener('click', function (e) {
    var b = e.target.closest('.jv-chip'); if (!b) return;
    _sheet.querySelectorAll('#w-types .jv-chip').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
  });
  _sheet.querySelector('#w-open-plan').addEventListener('click', function () {
    jvCloseSheet(); setTimeout(jvPlanSheet, 260);
  });
}

// ── Долоо хоногийн төлөвлөгөө ─────────────────────────────────────
function jvPlanSheet() {
  var names = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
  var p = jvPlan(), today = new Date().getDay();
  var rows = names.map(function (n, i) {
    var opts = JV_WORKOUTS.map(function (t) {
      return '<option' + (p[i] === t ? ' selected' : '') + '>' + t + '</option>';
    }).join('');
    return '<div class="jv-plan-row' + (i === today ? ' today' : '') + '">' +
           '<b>' + n + '</b><select data-d="' + i + '">' + opts + '</select></div>';
  }).join('');

  jvSheet('Долоо хоногийн төлөвлөгөө', 'Өдөр бүр ямар дасгал хийхээ товло. Нүүр хуудсанд өнөөдрийнх нь харагдана.',
    '<div class="jv-plan">' + rows + '</div>',
    function (sh) {
      var np = {};
      sh.querySelectorAll('.jv-plan-row select').forEach(function (sel) {
        np[sel.dataset.d] = sel.value;
      });
      jvSavePlan(np);
    });
}

// ── Толгой ────────────────────────────────────────────────────────
(function head() {
  var days = ['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
  var d = new Date();
  document.getElementById('h-date').textContent =
    days[d.getDay()] + ' · ' + (d.getMonth() + 1) + '-р сарын ' + d.getDate();

  var name = '';
  try { name = localStorage.getItem('jarvis_callsign') || localStorage.getItem('jarvis_name') || ''; } catch (e) {}
  var h = d.getHours();
  var hello = h < 5 ? 'Сайхан амраарай' : h < 12 ? 'Өглөөний мэнд' : h < 18 ? 'Өдрийн мэнд' : 'Оройн мэнд';
  document.getElementById('h-greet').textContent = hello + (name ? ', ' + name : '');
})();

// ── Гурван тоо ────────────────────────────────────────────────────
function renderStats() {
  var r = jvLoad();
  var sc = jvScore(r);
  document.getElementById('s-score').textContent = sc;
  document.getElementById('s-score-bar').style.width = sc + '%';

  var lbl = document.getElementById('s-exam-label');
  var lvl = window.JARVIS_EXAM_LEVEL || 'Шалгалт';
  lbl.textContent = lvl + ' хүртэл';
  document.getElementById('s-exam').textContent =
    window.jarvisExamDays ? window.jarvisExamDays() : '—';

  document.getElementById('s-streak').textContent = jvStreak();
}

// ── Дараа нь юу хийх вэ ───────────────────────────────────────────
// Дараалал: хийгээгүй нь дээр, хийсэн нь доор. Хамгийн эхнийх нь
// тодруулагдана — "яг одоо үүнийг хий" гэсэн ганц зөвлөмж.
var ACTS = [
  { key: 'hanzi',    icon: 'hsk',     name: '20 шинэ үг цээжил', note: '10 минут', go: 'hsk' },
  { key: 'water',    icon: 'water',   name: 'Ус уу',      sheet: jvWaterSheet },
  { key: 'exercise', icon: 'gym',     name: 'Дасгал хий', sheet: jvWorkoutSheet },
  { key: 'read',     icon: 'book',    name: 'Ном унш',           note: '20 хуудас' },
  { key: 'journal',  icon: 'pen',     name: 'Тэмдэглэл бич',     note: 'Өдрийн эцэст', go: 'life' },
];

var EXTRA_ICONS = {
  water: '<path d="M12 3.5s6 6.3 6 10.2a6 6 0 0 1-12 0C6 9.8 12 3.5 12 3.5z"/>',
  gym:   '<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10"/>',
  book:  '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 18.5h15"/>',
  pen:   '<path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M13.5 6.5l4 4"/>',
  check: '<path d="M5 12.5 10 17.5 19 7.5"/>',
  arrow: '<path d="M5 12h13"/><path d="M13 6.5 18.5 12 13 17.5"/>',
};
function ico(name) {
  var body = EXTRA_ICONS[name];
  if (body) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
           'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
  }
  return window.jarvisShell.icon(name);
}

function renderActs() {
  var r = jvLoad();
  var list = document.getElementById('a-list');
  var todo = [], done = [];

  ACTS.forEach(function (a) {
    var isDone = a.key === 'water' ? (jvWaterMl() >= jvCfg().goalMl) : !!r[a.key];
    (isDone ? done : todo).push({ a: a, done: isDone });
  });

  document.getElementById('a-count').textContent =
    done.length + ' / ' + ACTS.length + ' хийгдсэн';

  if (todo.length === 0) {
    list.innerHTML =
      '<div class="jv-clear"><b>Өнөөдрийн ажил дууслаа</b>' +
      'Бүх зүйл хийгдсэн байна. Сайхан амраарай.</div>';
    return;
  }

  list.innerHTML = '';
  todo.concat(done).forEach(function (it, i) {
    var a = it.a, first = (i === 0 && !it.done);
    var note = a.note || '';
    if (a.key === 'water') {
      var c = jvCfg();
      // Хоёр тоог НЭГ нэгжээр харуулна — "0 мл / 2 л" гэж уншихад эвгүй
      var drank = jvWaterMl();
      var big   = c.goalMl >= 1000;
      var fmt   = function (ml) {
        return big ? (ml / 1000).toFixed(ml % 1000 === 0 ? 0 : 1) : String(ml);
      };
      note = fmt(drank) + ' / ' + fmt(c.goalMl) + (big ? ' л' : ' мл') +
             ' · ' + Math.round(drank / c.cupMl) + '/' + jvCups() + ' аяга';
    }
    if (a.key === 'exercise') {
      var lg = jvLog();
      note = it.done && lg ? lg.type + ' · ' + lg.mins + ' минут'
                           : (jvTodayPlan() ? 'Өнөөдөр: ' + jvTodayPlan() : 'Төлөвлөгөө тохируулаагүй');
    }

    var el = document.createElement(a.go && !it.done ? 'a' : 'div');
    if (a.sheet) { el.dataset.sheet = a.key; el.style.cursor = 'pointer'; }
    el.className = 'jv-act' + (first ? ' jv-act--next' : '') + (it.done ? ' jv-act--done' : '');
    if (a.go && !it.done) el.href = window.jarvisShell.href(a.go);

    var side = it.done ? ''
      : a.key === 'water'
        ? '<button class="jv-mini" data-water="1" aria-label="Нэг аяга ус нэмэх">+1</button>'
        : a.go
          ? '<span class="jv-act-side">' + ico('arrow') + '</span>'
          : '<button class="jv-mini" data-done="' + a.key + '">Хийсэн</button>';

    el.innerHTML =
      '<span class="jv-act-ico">' + ico(it.done ? 'check' : a.icon) + '</span>' +
      '<span class="jv-act-body">' +
        '<span class="jv-act-name">' + a.name + '</span>' +
        (note ? '<span class="jv-act-note">' + note + '</span>' : '') +
      '</span>' + side;

    list.appendChild(el);
  });
}

// Товч дарах — нэг сонсогч бүх мөрд
document.getElementById('a-list').addEventListener('click', function (e) {
  var w = e.target.closest('[data-water]');
  var d = e.target.closest('[data-done]');
  if (!w && !d) {
    // Мөрийг өөрийг нь дарвал тохиргоо/тэмдэглэлийн самбар нээгдэнэ
    var row = e.target.closest('[data-sheet]');
    if (row) {
      e.preventDefault();
      if (row.dataset.sheet === 'water')    jvWaterSheet();
      if (row.dataset.sheet === 'exercise') jvWorkoutSheet();
    }
    return;
  }
  e.preventDefault();
  if (d && d.getAttribute('data-done') === 'exercise') { jvWorkoutSheet(); return; }
  var r = jvLoad();
  if (w) jvSetWaterMl(jvWaterMl() + jvCfg().cupMl);
  if (d) { r[d.getAttribute('data-done')] = true; jvSave(r); }
  renderAll();
});

// ── Долоо хоногийн явц ────────────────────────────────────────────
function renderWeek() {
  var names = ['Ня','Да','Мя','Лх','Пү','Ба','Бя'];
  var box = document.getElementById('w-week');
  var total = 0, counted = 0;
  box.innerHTML = '';

  for (var i = 6; i >= 0; i--) {
    var key = jvDay(i);
    var r = null;
    try { r = JSON.parse(localStorage.getItem('jarvis_r_' + key) || 'null'); } catch (e) {}
    if (i === 0) r = jvLoad();
    var sc = jvScore(r, key);
    if (r) { total += sc; counted++; }

    var dt = new Date(); dt.setDate(dt.getDate() - i);
    var col = document.createElement('div');
    col.className = 'jv-day' + (i === 0 ? ' jv-day--today' : '');
    col.innerHTML =
      '<div class="jv-day-bar" title="' + sc + '/100"><i style="height:' + Math.max(sc, 3) + '%"></i></div>' +
      '<div class="jv-day-name">' + names[dt.getDay()] + '</div>';
    box.appendChild(col);
  }
  document.getElementById('w-avg').textContent =
    counted ? 'Дундаж ' + Math.round(total / counted) + '/100' : 'Дата хараахан алга';
}

function renderAll() { renderStats(); renderActs(); renderWeek(); }
renderAll();

// Шөнө дундын дараа хуудсыг шинэчилнэ
setInterval(function () {
  if (jvLoad().date !== jvToday()) renderAll();
}, 60000);
</script>
